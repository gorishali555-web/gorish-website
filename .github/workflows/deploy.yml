
name: GORISH Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gorish-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate website files
        run: |
          test index.html
          test style.css
          test Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/gorish-website:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/gorish-website:${{ github.sha }}

      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -eu

            IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/gorish-website:${{ github.sha }}"

            sudo docker pull "$IMAGE"

            sudo docker rm -f gorish-website 2>/dev/null || true

            sudo docker run -d \
              --name gorish-website \
              --restart unless-stopped \
              -p 80:80 \
              "$IMAGE"

            sleep 3

            sudo docker inspect \
              --format='{{.State.Running}}' gorish-website

            curl --fail --retry 5 --retry-connrefused \
              --retry-delay 2 http://localhost/
